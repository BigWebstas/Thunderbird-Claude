<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Mail Sorter: activity</title>
  <style>
    body { font: menu; margin: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); vertical-align: top; }
    th { position: sticky; top: 0; background: Canvas; }
    .muted { opacity: 0.7; }
    .undone td { opacity: 0.5; }
    #error { color: #c01c28; min-height: 1em; }
  </style>
</head>
<body>
  <h2>Activity log</h2>
  <p class="muted">The last 500 things Claude did. Undo puts the email back where it was and removes the flag, tags or junk mark Claude added.</p>
  <p id="error" role="alert"></p>
  <table>
    <thead>
      <tr><th>When</th><th>Email</th><th>What happened</th><th>Why</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="empty" class="muted" hidden>Nothing yet.</p>
  <script src="log.js"></script>
</body>
</html>
