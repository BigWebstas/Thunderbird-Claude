name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package add-on
        run: zip -r claude-mail-sorter.xpi manifest.json background.js icons options log

      - uses: actions/upload-artifact@v4
        with:
          name: claude-mail-sorter-xpi
          path: claude-mail-sorter.xpi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" claude-mail-sorter.xpi --generate-notes
